name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: rustup target add ${{ matrix.target }}
      # zigbuild provides the C cross-compiler + linker for both musl
      # targets (the bundled SQLite C source needs one; a plain
      # `cargo build` cannot cross to aarch64-musl on an x86_64 runner).
      - name: Install zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: |
          curl -sSfL https://github.com/rust-cross/cargo-zigbuild/releases/latest/download/cargo-zigbuild-installer.sh | sh
      - name: Build
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          tar czf urania-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release urania
          # sha256sum is absent on macOS runners; fall back to shasum.
          (cd target/${{ matrix.target }}/release \
            && (sha256sum urania 2>/dev/null || shasum -a 256 urania) > urania.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: urania-${{ matrix.target }}
          path: |
            urania-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/urania.sha256
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          find artifacts -name '*.sha256' -exec cat {} \; > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS
