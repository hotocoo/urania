name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl target
        if: contains(matrix.target, 'musl')
        run: rustup target add ${{ matrix.target }}
      # zigbuild provides the C cross-compiler + linker for both musl
      # targets (the bundled SQLite C source needs one; a plain
      # `cargo build` cannot cross to aarch64-musl on an x86_64 runner).
      - name: Install zig
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: |
          curl -sSfL https://github.com/rust-cross/cargo-zigbuild/releases/latest/download/cargo-zigbuild-installer.sh | sh
      - name: Build
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      # Only the x86_64-musl binary can execute on the ubuntu runners;
      # the aarch64-musl and darwin legs are verified by CI + the static
      # link check there. selftest runs the full evidence chain (local
      # TCP dummy, probe, report, manifest, verify) on the release binary.
      - name: Smoke test (x86_64-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ./target/x86_64-unknown-linux-musl/release/urania --version
          ./target/x86_64-unknown-linux-musl/release/urania selftest
      - name: Package
        run: |
          STAGE=target/release-stage
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/urania "$STAGE/"
          cp LICENSE "$STAGE/"
          tar czf urania-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C "$STAGE" urania LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: urania-${{ matrix.target }}
          path: urania-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Checksums over the released tarballs (each contains a binary
      # named `urania`, so per-binary hashes would be indistinguishable).
      # Bare filenames: the user downloads flat files, so
      # `sha256sum -c SHA256SUMS --ignore-missing` must match them. With
      # the `artifacts/<target>/` prefix every line is "missing" and
      # --ignore-missing passes silently, verifying nothing.
      - name: Checksums
        run: |
          find artifacts -name '*.tar.gz' -print0 | sort -z | \
            xargs -0 sha256sum | sed 's|artifacts/[^/]*/||' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS
  # Multi-arch container image (linux/amd64 + linux/arm64) on GHCR.
  docker:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hotocoo/urania:${{ github.ref_name }}
            ghcr.io/hotocoo/urania:latest
      # The pushed image must actually work: full selftest in the
      # amd64 container (scratch image, static binary).
      - name: Smoke test (pushed image)
        run: |
          docker run --rm --platform linux/amd64 \
            ghcr.io/hotocoo/urania:${{ github.ref_name }} selftest
